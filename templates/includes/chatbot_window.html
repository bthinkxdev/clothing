<!-- templates/includes/chatbot_window.html -->
{% load static %}

<div id="chatbot-window" class="chatbot-window" style="display: none;">
    <div class="chatbot-header">
        <div class="chatbot-header-content">
            <div class="chatbot-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 8V4H8"></path>
                    <rect x="2" y="8" width="20" height="12" rx="2"></rect>
                    <path d="M6 15h.01M10 15h.01"></path>
                </svg>
            </div>
            <div>
                <h3 class="chatbot-title">Support Assistant</h3>
                <p class="chatbot-status">Online</p>
            </div>
        </div>
        <button id="chatbot-close" class="chatbot-close-btn" aria-label="Close chat">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>
    
    <div id="chatbot-messages" class="chatbot-messages">
        <div class="chatbot-message bot-message">
            <div class="message-content">
                <p>Hello! 👋 I'm your shopping assistant. I can help you with:</p>
                <ul>
                    <li>Track your orders</li>
                    <li>Find products</li>
                    <li>Size recommendations</li>
                    <li>Answer questions</li>
                </ul>
                <p>How can I assist you today?</p>
            </div>
        </div>
    </div>
    
    <div id="chatbot-suggestions" class="chatbot-suggestions"></div>
    
    <div class="chatbot-input-area">
        <div class="chatbot-input-wrapper">
            <input 
                type="text" 
                id="chatbot-input" 
                class="chatbot-input" 
                placeholder="Type your message..."
                autocomplete="off"
            >
            <button id="chatbot-send" class="chatbot-send-btn" aria-label="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <div id="chatbot-typing" class="chatbot-typing" style="display: none;">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>
