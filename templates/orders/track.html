{% extends 'base.html' %}
{% load static %}

{% block title %}Track Order{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account.css' %}">
{% endblock %}

{% block content %}
<div class="container account-page">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>Track your order</h2>
        <form method="post" class="form-grid">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Track</button>
        </form>

        {% if order %}
        <div class="line" style="margin:12px 0;"></div>
        <div class="summary">
            <div class="summary-row"><span>Order</span><span>{{ order.id }}</span></div>
            <div class="summary-row"><span>Status</span><span class="badge">{{ order.status }}</span></div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
